# Gitleaks configuration: default rules + project-specific additions.

[extend]
useDefault = true

# Compose/shell fallbacks such as ${DB_PASSWORD:-postgres} silently turn a
# missing secret into a well-known one. Secrets must be mandatory: ${VAR:?msg}.
[[rules]]
id = "shell-secret-default"
description = "Secret-like variable with a hardcoded fallback value (${VAR:-value})"
regex = '''\$\{[A-Za-z0-9_]*(?i:password|passwd|secret|token|api_key|private_key)[A-Za-z0-9_]*:?-[^}?\s][^}]*\}'''
keywords = ["password", "passwd", "secret", "token", "api_key", "private_key"]

# Public, documented Azure built-in role definition IDs used by the Bicep modules
# (https://learn.microsoft.com/azure/role-based-access-control/built-in-roles).
# They identify roles, they are not credentials.
[[allowlists]]
description = "Azure built-in role definition IDs"
regexTarget = "match"
regexes = [
  '''7f951dda-4ed3-4680-a7ca-43fe172d538d''', # AcrPull
  '''4633458b-17de-408a-b874-0445c86b69e6''', # Key Vault Secrets User
  '''69a216fc-b8fb-44d8-bc22-1f3c2cd27a39''', # Azure Service Bus Data Sender
  '''4f6d3b9b-027b-4f4c-9142-0e5a2a2247e0''', # Azure Service Bus Data Receiver
  '''b7e6dc6d-f1e8-4753-8033-0f276bb0955b''', # Storage Blob Data Owner
  '''974c5e8b-45b9-4653-ba55-5f855dd0fb88''', # Storage Queue Data Contributor
  '''0a9a7e1f-b9d0-4cc4-a60d-0319b160aaa3''', # Storage Table Data Contributor
]
