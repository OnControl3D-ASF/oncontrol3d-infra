# D5 (CUTTABLE): second LoadBalancer for the `oncontrol-prod` host, same Traefik pods, own public IP and DNS label.
# Rendered only for env=prod (render.sh). The Traefik chart already creates the dev Service `traefik`.
apiVersion: v1
kind: Service
metadata:
  name: traefik-prod
  namespace: traefik
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-traefik
    app.kubernetes.io/component: edge-prod
  annotations:
    service.beta.kubernetes.io/azure-dns-label-name: ${DNS_LABEL}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-traefik
  ports:
    - name: web
      port: 80
      targetPort: web
      protocol: TCP
    - name: websecure
      port: 443
      targetPort: websecure
      protocol: TCP
