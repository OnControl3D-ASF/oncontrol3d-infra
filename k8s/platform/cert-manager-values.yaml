# cert-manager (E2). Installed in namespace `cert-manager` by platform.yml.
crds:
  enabled: true
  keep: true # `helm uninstall` must never delete Certificates/Issuers

# Smallest footprint that fits the 2-node dev cluster (design capacity table: ~60m / 160Mi total).
resources:
  requests:
    cpu: 30m
    memory: 64Mi
  limits:
    memory: 128Mi
webhook:
  # AKS's admissions enforcer adds kubernetes.azure.com/managedby and control-plane exclusions to every webhook.
  # Helm 4 applies server-side: declaring the SAME selector (same order) shares field ownership instead of failing
  # every upgrade with "conflict with admissionsenforcer ... namespaceSelector" (first seen 2026-11-23).
  validatingWebhookConfiguration:
    namespaceSelector:
      matchExpressions:
        - key: cert-manager.io/disable-validation
          operator: NotIn
          values: ["true"]
        - key: kubernetes.azure.com/managedby
          operator: NotIn
          values: ["aks"]
        - key: control-plane
          operator: NotIn
          values: ["true"]
  mutatingWebhookConfiguration:
    namespaceSelector:
      matchExpressions:
        - key: control-plane
          operator: NotIn
          values: ["true"]
        - key: kubernetes.azure.com/managedby
          operator: NotIn
          values: ["aks"]
  resources:
    requests:
      cpu: 15m
      memory: 32Mi
    limits:
      memory: 64Mi
cainjector:
  resources:
    requests:
      cpu: 15m
      memory: 64Mi
    limits:
      memory: 128Mi
startupapicheck:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

prometheus:
  enabled: false # no Prometheus in the cluster
